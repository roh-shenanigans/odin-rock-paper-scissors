<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors</title>
    <script src="game.js" defer></script>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div class="heading">
        <h1>Rock-Paper-Scissors</h1>
        <h2>Choose your option</h2>
    </div>

    <div class="buttons">
        <button id="rock">🪨<br><span class="desc">Rock</span></button>
        <button id="paper">📄<br><span class="desc">Paper</span></button>
        <button id="scissors">✂️<br><span class="desc">Scissors</span></button>
    </div>

    <div id="score"></div>
    <div id="results"></div>
  </body>
</html>
